<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Projeto API</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 40px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Consumindo API Pública</h1>

  <h2 id="titulo">Carregando...</h2>
  <p id="texto"></p>
</div>

<script>
async function carregarAPI() {
  try {
    const resposta = await fetch('https://jsonplaceholder.typicode.com/posts/1');
    const dados = await resposta.json();

    document.getElementById('titulo').innerText = dados.title;
    document.getElementById('texto').innerText = dados.body;
  } catch (erro) {
    document.getElementById('titulo').innerText = 'Erro ao carregar API';
  }
}

carregarAPI();
</script>

</body>
</html>
